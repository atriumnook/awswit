[workspace]

[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = ["github"]
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]

[package]
name = "awswit"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Interactive AWS profile switcher with fuzzy search"
license = "MIT"
repository = "https://github.com/atriumnook/awswit"
keywords = ["aws", "profile", "switcher", "tui", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "awswit"
path = "src/lib.rs"

[[bin]]
name = "awswit"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive", "env", "string"] }
clap_complete = "4.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"

# Directory paths
dirs = "5.0"

# Fuzzy matching
strsim = "0.10"
nucleo-matcher = "0.3"

# Modern TUI
ratatui = { version = "0.25", features = ["crossterm"] }
crossterm = "0.27"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Shell path expansion
shellexpand = "3.1"

# Shell-like argument splitting
shell-words = "1.1"

[dev-dependencies]
tempfile = "3.9"
strsim = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with.
[profile.dist]
inherits = "release"
lto = "thin"

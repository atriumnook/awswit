[package]
name = "awswit"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Fast AWS profile switcher with interactive TUI"
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "awswit"
path = "src/main.rs"

[[bin]]
name = "autoawswit"
path = "src/bin/autoawswit.rs"

[dependencies]
aws-config = { version = "1.1", features = ["behavior-version-latest"] }
aws-sdk-sts = "1.9"
aws-credential-types = "1.1"
aws-types = "1.1"
tokio = { version = "1.35", features = ["full"] }
clap = { version = "4.4", features = ["derive", "env", "string"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
configparser = "3.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
colored = "2.0"
dirs = "5.0"
dotenvy = "0.15"
sysinfo = "0.29"
strsim = "0.10"
dialoguer = "0.11"
ratatui = { version = "0.25", features = ["crossterm"] }
crossterm = "0.27"
indicatif = "0.17"
console = "0.15"
humantime = "2.1"
atty = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fs2 = "0.4"
shellexpand = "3.1"
uuid = { version = "1.6", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
lto = true
codegen-units = 1
strip = true

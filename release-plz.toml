[workspace]
# Don't publish to crates.io (this is a binary-only project).
publish = false
# This package has no registry baseline; cargo-dist-created Git tags are the
# authoritative version history for release PR calculation.
git_only = true
# Let cargo-dist own tags and GitHub Releases; release-plz only opens release PRs.
git_release_enable = false
# Use keep-a-changelog format (default).
changelog_update = true
# Publishing is an explicit, gated workflow dispatch after its release PR lands.
git_tag_enable = false

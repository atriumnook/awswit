[workspace]
# Don't publish to crates.io (this is a binary-only project). The README
# crates.io badge was a false signal — there is no crate to `cargo install`.
publish = false
# Let dist (cargo-dist) create the GitHub Release; release-plz only creates the tag.
# A tag pushed with GITHUB_TOKEN will NOT start release.yml (GitHub recursion
# guard). See .github/workflows/release-plz.yml for the PAT + workflow_dispatch
# workaround. Do not set cargo-dist `dispatch-releases = true`: that replaces
# tag-push triggers and would break a human `git push origin vX.Y.Z`.
git_release_enable = false
# Take the latest released version from git tags (`v{{ version }}`), not
# crates.io. With `publish = false` the crate is never on the registry, so
# release-plz would otherwise treat 0.1.0 as the first release, see the
# existing v0.1.0 tag, and never propose a version bump.
git_only = true
# Push the tag so dist's release workflow runs (via PAT, or via explicit dispatch).
git_tag_enable = true
# Update CHANGELOG.md from conventional commits.
changelog_update = true

# Custom changelog template.
# - Heading is `## v0.0.X` (no date, no markdown link), so cargo-dist parses
#   the GitHub Release title as "v0.0.X" — matching ripgrep / fzf / eza / bat
#   conventions.
# - Release date moves to the body as `_Released on YYYY-MM-DD_`.
[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.
"""
body = """
## v{{ version | trim_start_matches(pat="v") }}

{% if timestamp -%}
_Released on {{ timestamp | date(format="%Y-%m-%d") }}_
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits -%}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true
commit_parsers = [
    { message = "^feat[(:!]", group = "Features" },
    { message = "^fix[(:!]", group = "Bug Fixes" },
    { message = "^perf[(:!]", group = "Performance" },
    { message = "^refactor[(:!]", group = "Refactor" },
    { message = "^docs?[(:!]", group = "Documentation" },
    { message = "^test[(:!]", group = "Tests" },
    { message = "^ci[(:!]", group = "CI" },
    { message = "^chore\\(release\\):", skip = true },
    { message = "^chore[(:!]", group = "Miscellaneous" },
    { message = "^review[(:!]", skip = true },
    { message = "^Merge ", skip = true },
]

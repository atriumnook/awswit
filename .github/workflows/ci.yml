name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# A newer push to the same PR or branch supersedes the running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Every job builds with the toolchain pinned in rust-toolchain.toml, which
# is also the MSRV (`rust-version` in Cargo.toml). A toolchain matrix here
# would not test anything else: the file overrides whatever a setup action
# installs, so the former `beta` lanes compiled with 1.94 as well.
jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --locked --all-features

  shells:
    name: Shell integration (bash, zsh, fish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install shells and botocore
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh fish
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install botocore==1.43.120

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-shells-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - name: Build
        run: cargo build --locked

      - name: Run shell conformance
        run: |
          "$RUNNER_TEMP/venv/bin/python" tests/shell_conformance.py target/debug/awswit bash zsh fish

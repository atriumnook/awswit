name: Release artifact gate

on:
  workflow_call:
    inputs:
      plan:
        description: cargo-dist release plan
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-request:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate publishing branch
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != "dry-run" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from main" >&2
            exit 1
          fi

  rust-and-shell-quality:
    name: Rust 1.94 and four-shell quality
    needs: validate-request
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify release commit checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install shell parsers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fish zsh

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94
        with:
          toolchain: 1.94
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-release-gate-1.94-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run unit and integration tests
        run: cargo test --locked --all-targets --all-features

      - name: Enforce catalog and fuzzy-filter p95 budgets
        run: >-
          cargo test --locked --release --lib performance_contract
          -- --ignored --nocapture

      - name: Build shell-contract executable
        run: cargo build --locked --bin awswit

      - name: Parse Bash integration
        run: bash -n src/init/bash.sh

      - name: Parse Zsh integration
        run: zsh -n src/init/zsh.sh

      - name: Parse Fish integration
        run: fish --no-execute src/init/fish.fish

      # BEGIN AWSWIT FOUR SHELL CONFORMANCE
      - name: Exercise Bash and Zsh protocol conformance
        shell: bash
        run: |
          set -euo pipefail
          for shell in bash zsh; do
            # The nested shell program is single-quoted Bash/Zsh data.
            # shellcheck disable=SC2016
            "$shell" -c '
              set -eu
              eval "$(target/debug/awswit init '"$shell"')"
              while IFS="$(printf "\t")" read -r name expected encoded; do
                case "$name" in ""|\#*) continue ;; esac
                export AWS_PROFILE=before AWS_DEFAULT_PROFILE=before AWSWIT_PROFILE=before
                export AWS_REGION=before-region AWS_DEFAULT_REGION=before-region
                export AWS_CONFIG_FILE=before-config
                if test "$name" = valid_new_credential_overrides; then
                  for key in AWS_EC2_METADATA_SERVICE_ENDPOINT AWS_BEARER_TOKEN_BEDROCK AWS_LOGIN_CACHE_DIRECTORY AWS_ACCESS_KEY AWS_SECRET_KEY AMAZON_ACCESS_KEY_ID AMAZON_SECRET_ACCESS_KEY AMAZON_SESSION_TOKEN AWS_CREDENTIAL_PROFILES_FILE; do
                    export "$key=before-override"
                  done
                fi
                frame=$(printf "%s" "$encoded" | base64 --decode)
                if _awswit_apply_patch "$frame" >/dev/null 2>/dev/null; then
                  actual=accept
                else
                  actual=reject
                fi
                test "$actual" = "$expected" || {
                  printf "%s: %s expected %s, got %s\n" '"$shell"' "$name" "$expected" "$actual" >&2
                  exit 1
                }
                if test "$expected" = reject; then
                  test "$AWS_PROFILE" = before
                  test "$AWS_DEFAULT_PROFILE" = before
                  test "$AWSWIT_PROFILE" = before
                  test "$AWS_REGION" = before-region
                  test "$AWS_DEFAULT_REGION" = before-region
                  test "$AWS_CONFIG_FILE" = before-config
                elif test "$name" = valid_literal; then
                  test "$AWS_PROFILE" = '\''literal $HOME;$(touch SHOULD_NOT_EXIST)=tail'\''
                  test ! -e SHOULD_NOT_EXIST
                elif test "$name" = valid_new_credential_overrides; then
                  test "$AWS_PROFILE" = after
                  for key in AWS_EC2_METADATA_SERVICE_ENDPOINT AWS_BEARER_TOKEN_BEDROCK AWS_LOGIN_CACHE_DIRECTORY AWS_ACCESS_KEY AWS_SECRET_KEY AMAZON_ACCESS_KEY_ID AMAZON_SECRET_ACCESS_KEY AMAZON_SESSION_TOKEN AWS_CREDENTIAL_PROFILES_FILE; do
                    if env | cut -d= -f1 | grep -Fxq "$key"; then
                      printf "%s left %s present after UNSET\n" '"$shell"' "$key" >&2
                      exit 1
                    fi
                  done
                fi
              done < tests/activation_protocol_vectors.tsv
            '
          done

      - name: Exercise Fish activation transaction
        shell: bash
        run: |
          set -euo pipefail
          fish_state=$(mktemp -d)
          # This is a single-quoted Fish program, not Bash source.
          # shellcheck disable=SC1012,SC2016
          XDG_CONFIG_HOME="$fish_state" fish --no-config -c '
            target/debug/awswit init fish | source
            set -l literal '\''literal $HOME;$(touch SHOULD_NOT_EXIST)=tail'\''
            set -l frame \
              "AWSWIT-PATCH 1 ACTIVATE" \
              "SET AWS_PROFILE=$literal" \
              "SET AWS_DEFAULT_PROFILE=$literal" \
              "SET AWSWIT_PROFILE=$literal" \
              "UNSET AWS_REGION" \
              "UNSET AWS_DEFAULT_REGION" \
              "AWSWIT-COMMIT"
            __awswit_apply_patch $frame >/dev/null 2>/dev/null
            test "$AWS_PROFILE" = "$literal"
            test "$AWS_DEFAULT_PROFILE" = "$literal"
            test "$AWSWIT_PROFILE" = "$literal"
            test ! -e SHOULD_NOT_EXIST

            set -Ux AWS_REGION persistent-universal
            set -l unset_frame \
              "AWSWIT-PATCH 1 UNSET" \
              "UNSET AWS_PROFILE" \
              "UNSET AWS_DEFAULT_PROFILE" \
              "UNSET AWSWIT_PROFILE" \
              "UNSET AWS_REGION" \
              "UNSET AWS_DEFAULT_REGION" \
              "AWSWIT-COMMIT"
            __awswit_apply_patch $unset_frame >/dev/null 2>/dev/null
            env | string match -q "AWS_REGION=*"; and exit 20
            set -eg AWS_REGION
            test "$AWS_REGION" = persistent-universal
            set -eU AWS_REGION

            set -gx AWS_PROFILE before
            set -l truncated \
              "AWSWIT-PATCH 1 ACTIVATE" \
              "SET AWS_PROFILE=after" \
              "SET AWS_DEFAULT_PROFILE=after"
            __awswit_apply_patch $truncated >/dev/null 2>/dev/null; and exit 21
            test "$AWS_PROFILE" = before

            for row in (string match -rv '^#' < tests/activation_protocol_vectors.tsv)
              set -l fields (string split \t -- "$row")
              test (count $fields) -eq 3; or exit 22
              set -gx AWS_PROFILE before
              set -gx AWS_DEFAULT_PROFILE before
              set -gx AWSWIT_PROFILE before
              set -gx AWS_REGION before-region
              set -gx AWS_DEFAULT_REGION before-region
              set -gx AWS_CONFIG_FILE before-config
              if test "$fields[1]" = valid_new_credential_overrides
                for key in AWS_EC2_METADATA_SERVICE_ENDPOINT AWS_BEARER_TOKEN_BEDROCK AWS_LOGIN_CACHE_DIRECTORY AWS_ACCESS_KEY AWS_SECRET_KEY AMAZON_ACCESS_KEY_ID AMAZON_SECRET_ACCESS_KEY AMAZON_SESSION_TOKEN AWS_CREDENTIAL_PROFILES_FILE
                  set -gx "$key" before-override
                end
              end
              set -l decoded (printf %s "$fields[3]" | base64 --decode | string split \n)
              if __awswit_apply_patch $decoded >/dev/null 2>/dev/null
                set actual accept
              else
                set actual reject
              end
              test "$actual" = "$fields[2]"; or exit 23
              if test "$fields[2]" = reject
                test "$AWS_PROFILE" = before; or exit 24
                test "$AWS_DEFAULT_PROFILE" = before; or exit 25
                test "$AWSWIT_PROFILE" = before; or exit 26
                test "$AWS_REGION" = before-region; or exit 27
                test "$AWS_DEFAULT_REGION" = before-region; or exit 28
                test "$AWS_CONFIG_FILE" = before-config; or exit 29
              else if test "$fields[1]" = valid_literal
                test "$AWS_PROFILE" = '\''literal $HOME;$(touch SHOULD_NOT_EXIST)=tail'\''; or exit 30
                test ! -e SHOULD_NOT_EXIST; or exit 31
              else if test "$fields[1]" = valid_new_credential_overrides
                test "$AWS_PROFILE" = after; or exit 39
                for key in AWS_EC2_METADATA_SERVICE_ENDPOINT AWS_BEARER_TOKEN_BEDROCK AWS_LOGIN_CACHE_DIRECTORY AWS_ACCESS_KEY AWS_SECRET_KEY AMAZON_ACCESS_KEY_ID AMAZON_SECRET_ACCESS_KEY AMAZON_SESSION_TOKEN AWS_CREDENTIAL_PROFILES_FILE
                  env | string match -q "$key=*"; and exit 40
                end
              end
            end

            set fixture (mktemp -d)
            printf "[profile fish-runtime]\nregion=us-east-1\n" > $fixture/config
            printf "" > $fixture/credentials
            set -gx AWS_CONFIG_FILE $fixture/config
            set -gx AWS_SHARED_CREDENTIALS_FILE $fixture/credentials
            set -gx PATH (pwd)/target/debug $PATH
            awswit fish-runtime >/dev/null 2>/dev/null; or exit 32
            test "$AWS_PROFILE" = fish-runtime; or exit 33

            cp tests/completion_profiles.ini $fixture/config
            set -l root_names
            for row in (complete -C "awswit l")
              set -a root_names (string replace -r "\\t.*\$" "" -- "$row")
            end
            test (count (string match -- list $root_names)) -eq 1; or exit 34
            set -l profile_names
            for row in (complete -C "awswit activate ")
              set -a profile_names (string replace -r "\\t.*\$" "" -- "$row")
            end
            contains -- list $profile_names; or exit 35
            contains -- "team space" $profile_names; or exit 36
            contains -- "--profile=-h" $profile_names; or exit 37
            set -l option_names
            for row in (complete -C "awswit activate --r")
              set -a option_names (string replace -r "\\t.*\$" "" -- "$row")
            end
            contains -- --region $option_names; or exit 38
            rm -rf -- $fixture
          '
          rm -rf -- "$fish_state"

      - name: Parse PowerShell integration
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "src/init/powershell.ps1"),
            [ref] $tokens,
            [ref] $parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }

      # BEGIN AWSWIT POWERSHELL CONFORMANCE
      - name: Exercise PowerShell protocol conformance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$(Resolve-Path target/debug)$([IO.Path]::PathSeparator)$env:PATH"
          Invoke-Expression ((& target/debug/awswit init powershell) -join [Environment]::NewLine)
          foreach ($row in [IO.File]::ReadAllLines('tests/activation_protocol_vectors.tsv')) {
            if ([string]::IsNullOrWhiteSpace($row) -or $row.StartsWith('#')) { continue }
            $fields = $row.Split("`t")
            if ($fields.Count -ne 3) { throw "invalid protocol corpus row" }
            foreach ($name in @('AWS_PROFILE', 'AWS_DEFAULT_PROFILE', 'AWSWIT_PROFILE')) {
              [Environment]::SetEnvironmentVariable($name, 'before', 'Process')
            }
            foreach ($name in @('AWS_REGION', 'AWS_DEFAULT_REGION')) {
              [Environment]::SetEnvironmentVariable($name, 'before-region', 'Process')
            }
            [Environment]::SetEnvironmentVariable('AWS_CONFIG_FILE', 'before-config', 'Process')
            if ($fields[0] -ceq 'valid_new_credential_overrides') {
              foreach ($name in @(
                'AWS_EC2_METADATA_SERVICE_ENDPOINT', 'AWS_BEARER_TOKEN_BEDROCK',
                'AWS_LOGIN_CACHE_DIRECTORY', 'AWS_ACCESS_KEY', 'AWS_SECRET_KEY',
                'AMAZON_ACCESS_KEY_ID', 'AMAZON_SECRET_ACCESS_KEY',
                'AMAZON_SESSION_TOKEN', 'AWS_CREDENTIAL_PROFILES_FILE'
              )) {
                [Environment]::SetEnvironmentVariable($name, 'before-override', 'Process')
              }
            }
            $frame = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($fields[2])) -split "`n"
            $actual = if (Invoke-AwswitPatch -Lines $frame 2>$null) { 'accept' } else { 'reject' }
            if ($actual -cne $fields[1]) {
              throw "powershell: $($fields[0]) expected $($fields[1]), got $actual"
            }
            if ($fields[1] -ceq 'reject') {
              if ($env:AWS_PROFILE -cne 'before' -or
                  $env:AWS_DEFAULT_PROFILE -cne 'before' -or
                  $env:AWSWIT_PROFILE -cne 'before' -or
                  $env:AWS_REGION -cne 'before-region' -or
                  $env:AWS_DEFAULT_REGION -cne 'before-region' -or
                  $env:AWS_CONFIG_FILE -cne 'before-config') {
                throw "powershell: $($fields[0]) changed the environment before commit"
              }
            }
            elseif ($fields[0] -ceq 'valid_literal' -and
                    $env:AWS_PROFILE -cne 'literal $HOME;$(touch SHOULD_NOT_EXIST)=tail') {
              throw 'PowerShell did not preserve the literal profile value'
            }
            elseif ($fields[0] -ceq 'valid_new_credential_overrides' -and
                    $env:AWS_PROFILE -cne 'after') {
              throw 'PowerShell changed the valid override profile value'
            }
            if ($fields[0] -ceq 'valid_new_credential_overrides') {
              foreach ($name in @(
                'AWS_EC2_METADATA_SERVICE_ENDPOINT', 'AWS_BEARER_TOKEN_BEDROCK',
                'AWS_LOGIN_CACHE_DIRECTORY', 'AWS_ACCESS_KEY', 'AWS_SECRET_KEY',
                'AMAZON_ACCESS_KEY_ID', 'AMAZON_SECRET_ACCESS_KEY',
                'AMAZON_SESSION_TOKEN', 'AWS_CREDENTIAL_PROFILES_FILE'
              )) {
                if ($null -ne [Environment]::GetEnvironmentVariable($name, 'Process')) {
                  throw "PowerShell left $name present after UNSET"
                }
                $prefix = "$name="
                if (@(& /usr/bin/env | Where-Object {
                  $_.StartsWith($prefix, [StringComparison]::Ordinal)
                }).Count -ne 0) {
                  throw "PowerShell child inherited $name after UNSET"
                }
              }
            }
          }

          $fixture = Join-Path $env:RUNNER_TEMP 'awswit-completion'
          New-Item -ItemType Directory -Force $fixture | Out-Null
          Copy-Item tests/completion_profiles.ini (Join-Path $fixture 'config') -Force
          [IO.File]::WriteAllText((Join-Path $fixture 'credentials'), '')
          $env:AWS_CONFIG_FILE = Join-Path $fixture 'config'
          $env:AWS_SHARED_CREDENTIALS_FILE = Join-Path $fixture 'credentials'

          $global:AwswitStoredCredentialTouched = $false
          $storedCredentialSentinel = [pscustomobject]@{}
          $storedCredentialSentinel | Add-Member -MemberType ScriptProperty `
            -Name AccessKey -Value {
              $global:AwswitStoredCredentialTouched = $true
              throw 'awswit inspected a stored credential field'
            }
          $storedCredentialSentinel | Add-Member -MemberType ScriptMethod `
            -Name ToString -Value {
              $global:AwswitStoredCredentialTouched = $true
              throw 'awswit stringified stored credentials'
            } -Force
          $global:StoredAWSCredentials = $storedCredentialSentinel

          foreach ($case in @(
            @{ Name = 'explicit'; Invoke = { awswit activate list } },
            @{ Name = 'bare'; Invoke = { awswit } },
            @{ Name = 'shortcut'; Invoke = { awswit 'team space' } }
          )) {
            $env:AWS_PROFILE = 'before-stored-credential-check'
            $previousErrorWriter = [Console]::Error
            $capturedError = [IO.StringWriter]::new()
            try {
              [Console]::SetError($capturedError)
              & $case.Invoke
              $blockedExitCode = $LASTEXITCODE
            }
            finally {
              [Console]::SetError($previousErrorWriter)
            }
            if ($blockedExitCode -ne 1 -or
                $env:AWS_PROFILE -cne 'before-stored-credential-check') {
              throw "PowerShell $($case.Name) activation did not fail before mutation"
            }
            if (-not $capturedError.ToString().Contains('Clear-AWSCredential')) {
              throw "PowerShell $($case.Name) activation omitted stored-credential remediation"
            }
          }
          if ($global:AwswitStoredCredentialTouched) {
            throw 'PowerShell activation guard inspected stored credential data'
          }

          $global:StoredAWSCredentials = $null
          awswit activate list 2>$null
          if ($LASTEXITCODE -ne 0 -or $env:AWS_PROFILE -cne 'list') {
            throw 'PowerShell treated a null StoredAWSCredentials variable as credentials'
          }
          awswit activate --profile=-h 2>$null
          if ($LASTEXITCODE -ne 0 -or $env:AWS_PROFILE -cne '-h') {
            throw 'PowerShell named option did not activate a leading-hyphen profile'
          }
          awswit activate '--' -h 2>$null
          if ($LASTEXITCODE -ne 0 -or $env:AWS_PROFILE -cne '-h') {
            throw 'PowerShell did not preserve a quoted activation delimiter'
          }
          awswit '--' -h 2>$null
          if ($LASTEXITCODE -ne 0 -or $env:AWS_PROFILE -cne '-h') {
            throw 'PowerShell shortcut did not preserve a quoted activation delimiter'
          }

          $global:StoredAWSCredentials = $storedCredentialSentinel
          $namesWithStoredCredentials = @(awswit list --format names)
          if ($LASTEXITCODE -ne 0 -or $namesWithStoredCredentials -cnotcontains 'list') {
            throw 'PowerShell stored-credential guard blocked list'
          }
          $execOutput = @(
            awswit exec list --region us-west-2 --clear-credential-overrides -- `
              /usr/bin/printf '%s|%s' 'arg one' '--help'
          )
          if ($LASTEXITCODE -ne 0 -or ($execOutput -join "`n") -cne 'arg one|--help') {
            throw 'PowerShell did not reconstruct a positional exec boundary or preserve argv'
          }
          awswit exec --profile list --config-file $env:AWS_CONFIG_FILE `
            --credentials-file $env:AWS_SHARED_CREDENTIALS_FILE -- /usr/bin/true
          if ($LASTEXITCODE -ne 0) {
            throw 'PowerShell did not reconstruct a named-profile exec boundary'
          }

          foreach ($ambiguousCommand in @('-dash-command', '--help', '-V')) {
            $previousErrorWriter = [Console]::Error
            $capturedError = [IO.StringWriter]::new()
            try {
              [Console]::SetError($capturedError)
              awswit exec list -- $ambiguousCommand
              $ambiguousExecExitCode = $LASTEXITCODE
            }
            finally {
              [Console]::SetError($previousErrorWriter)
            }
            if ($ambiguousExecExitCode -ne 2 -or
                -not $capturedError.ToString().Contains("quote '--' and retry") -or
                $capturedError.ToString().Contains($ambiguousCommand)) {
              throw "PowerShell did not safely reject ambiguous exec command $ambiguousCommand"
            }
          }
          awswit exec list '--' -dash-command 2>$null
          if ($LASTEXITCODE -ne 127) {
            throw 'PowerShell did not forward a quoted exec delimiter unchanged'
          }
          awswit unset 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw 'PowerShell stored-credential guard blocked unset'
          }

          $global:LASTEXITCODE = 73
          $profileCompletions = @(TabExpansion2 'awswit activate ' 16).CompletionMatches
          if ($LASTEXITCODE -ne 73) {
            throw 'PowerShell profile completion changed the caller native exit status'
          }
          $profileMatches = @($profileCompletions.ListItemText)
          if ($profileMatches -cnotcontains 'list') {
            throw 'PowerShell explicit profile completion omitted a command-name profile'
          }
          $profileCompletionValues = @($profileCompletions.CompletionText | ForEach-Object { $_.Trim("'") })
          if ($profileMatches -cnotcontains 'team space' -or
              $profileCompletionValues -cnotcontains '--profile=-h') {
            throw 'PowerShell explicit profile completion changed a literal or leading-hyphen profile'
          }
          $optionMatches = @(TabExpansion2 'awswit activate --r' 19).CompletionMatches.CompletionText
          if ($optionMatches -cnotcontains '--region') {
            throw 'PowerShell combined completer omitted --region'
          }
          $rootMatches = @(TabExpansion2 'awswit l' 8).CompletionMatches.CompletionText
          if (@($rootMatches | Where-Object { $_ -ceq 'list' }).Count -ne 1) {
            throw 'PowerShell root completion duplicated a command/profile collision'
          }
          Remove-Variable -Name StoredAWSCredentials -Scope Global
          Remove-Variable -Name AwswitStoredCredentialTouched -Scope Global

          $unicodeFixture = Join-Path $env:RUNNER_TEMP 'awswit-unicode-output'
          New-Item -ItemType Directory -Force $unicodeFixture | Out-Null
          $unicodeConfig = Join-Path $unicodeFixture 'config'
          $unicodeCredentials = Join-Path $unicodeFixture 'credentials'
          [IO.File]::WriteAllText(
            $unicodeConfig,
            "[profile 東京]`nregion=ap-northeast-1`n",
            [Text.UTF8Encoding]::new($false)
          )
          [IO.File]::WriteAllText($unicodeCredentials, '')
          $env:AWS_CONFIG_FILE = $unicodeConfig
          $env:AWS_SHARED_CREDENTIALS_FILE = $unicodeCredentials

          $originalOutputEncoding = [Console]::OutputEncoding
          $legacyOutputEncoding = [Text.Encoding]::GetEncoding(437)
          try {
            [Console]::OutputEncoding = $legacyOutputEncoding
            awswit activate '東京' --region '地域-東京' `
              --config-file $unicodeConfig --credentials-file $unicodeCredentials
            if ($LASTEXITCODE -ne 0) {
              throw 'PowerShell Unicode activation failed under a legacy output code page'
            }
            if ($env:AWS_PROFILE -cne '東京' -or
                $env:AWS_DEFAULT_PROFILE -cne '東京' -or
                $env:AWSWIT_PROFILE -cne '東京' -or
                $env:AWS_REGION -cne '地域-東京' -or
                $env:AWS_DEFAULT_REGION -cne '地域-東京') {
              throw 'PowerShell changed Unicode profile or region while capturing native stdout'
            }
            if ([Console]::OutputEncoding.CodePage -ne $legacyOutputEncoding.CodePage) {
              throw 'PowerShell did not restore Console.OutputEncoding after activation'
            }

            $unicodeMatches = @(
              (TabExpansion2 'awswit activate 東' 17).CompletionMatches.ListItemText
            )
            if ($unicodeMatches -cnotcontains '東京') {
              throw 'PowerShell dynamic completion changed a Unicode profile name'
            }
            if ([Console]::OutputEncoding.CodePage -ne $legacyOutputEncoding.CodePage) {
              throw 'PowerShell did not restore Console.OutputEncoding after completion'
            }

            awswit activate 'missing-unicode-profile' `
              --config-file $unicodeConfig --credentials-file $unicodeCredentials 2>$null
            if ($LASTEXITCODE -eq 0) {
              throw 'PowerShell missing-profile activation unexpectedly succeeded'
            }
            if ([Console]::OutputEncoding.CodePage -ne $legacyOutputEncoding.CodePage) {
              throw 'PowerShell did not restore Console.OutputEncoding after native failure'
            }
          }
          finally {
            [Console]::OutputEncoding = $originalOutputEncoding
          }
      # END AWSWIT POWERSHELL CONFORMANCE
      # END AWSWIT FOUR SHELL CONFORMANCE

  repository-contract:
    name: Workflow, documentation, and release contract
    needs: validate-request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify release commit checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate GitHub Actions workflows
        run: >-
          docker run --rm
          -v "$PWD:/repo:ro"
          -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Validate repository-local Markdown links
        run: python3 .github/scripts/check-local-markdown-links.py

      - name: Exercise release asset contract fixtures
        run: python3 .github/scripts/test-release-asset-contract.py

      - name: Exercise release tag ruleset fixtures
        run: python3 .github/scripts/test-release-ruleset-contract.py

      - name: Exercise release repository policy fixtures
        run: bash .github/scripts/test-release-repository-policy.sh

      - name: Exercise release transaction ownership fixtures
        run: bash .github/scripts/test-release-transaction.sh

      - name: Install cargo-dist 0.31.0
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/cargo-dist"
          archive="cargo-dist-x86_64-unknown-linux-gnu.tar.xz"
          mkdir -p "$tool_root"
          curl --proto '=https' --tlsv1.2 -LsSf \
            --output "$tool_root/$archive" \
            "https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/$archive"
          expected_hash="cd355dab0b4c02fb59038fef87655550021d07f45f1d82f947a34ef98560abb8"
          actual_hash=$(sha256sum "$tool_root/$archive" | awk '{ print $1 }')
          test "$actual_hash" = "$expected_hash"
          tar -xJf "$tool_root/$archive" -C "$tool_root"
          echo "$tool_root/cargo-dist-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Verify generated workflow and release plan
        run: python3 .github/scripts/check-release-contract.py

  dependency-policy:
    name: Dependency policy and advisories
    needs: validate-request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify release commit checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  artifact-validation:
    name: Smoke artifacts and generate SBOM
    needs:
      - validate-request
      - rust-and-shell-quality
      - repository-contract
      - dependency-policy
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify release commit checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Download platform artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: artifacts-build-local-*
          path: artifacts
          merge-multiple: true

      - name: Download global artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-build-global
          path: artifacts

      - name: Verify exact cargo-dist assets, archives, and checksums
        run: python3 .github/scripts/validate-release-assets.py --phase build artifacts

      - name: Parse shell installer
        run: bash -n artifacts/awswit-installer.sh

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "artifacts/awswit-installer.ps1"),
            [ref] $tokens,
            [ref] $parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Smoke Linux executable
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/awswit-release-smoke"
          mkdir -p "$smoke_root"
          tar -xJf artifacts/awswit-x86_64-unknown-linux-gnu.tar.xz -C "$smoke_root"
          binary="$smoke_root/awswit-x86_64-unknown-linux-gnu/awswit"
          test -x "$binary"
          "$binary" --version | grep -Fq 'awswit '
          "$binary" --help >/dev/null

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94
        with:
          toolchain: 1.94

      - name: Install cargo-cyclonedx
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/cargo-cyclonedx"
          archive="cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz"
          release="cargo-cyclonedx-0.5.9"
          mkdir -p "$tool_root"
          curl --proto '=https' --tlsv1.2 -LsSf \
            --output "$tool_root/$archive" \
            "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/$release/$archive"
          expected_hash="fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8"
          actual_hash=$(sha256sum "$tool_root/$archive" | awk '{ print $1 }')
          test "$actual_hash" = "$expected_hash"
          tar -xJf "$tool_root/$archive" -C "$tool_root"
          echo "$tool_root/cargo-cyclonedx-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Generate and validate CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo cyclonedx -v
          test -s awswit.cdx.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("awswit.cdx.xml").getroot()
          namespace = {"c": root.tag.partition("}")[0].removeprefix("{")}
          if not root.findall(".//c:component", namespace):
              raise SystemExit("SBOM contains no components")
          PY
          mkdir release-gate
          mv awswit.cdx.xml release-gate/

      - name: Upload SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifacts-build-release-gate
          path: release-gate/*.cdx.xml
          if-no-files-found: error
          retention-days: 1

  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
      - custom-release-gate
    # Publishing is fail-closed: every build and verification gate must succeed.
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.build-global-artifacts.result == 'success' && needs.custom-release-gate.result == 'success' && needs.build-local-artifacts.result == 'success' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    permissions:
      "attestations": "write"
      "contents": "write"
      "id-token": "write"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      # BEGIN AWSWIT RELEASE REPOSITORY POLICY (HOST)
      - name: Reverify immutable releases and protected release tags
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: bash .github/scripts/check-release-repository-policy.sh "$RELEASE_TAG"
      # END AWSWIT RELEASE REPOSITORY POLICY (HOST)
      # BEGIN AWSWIT VERIFIED DIST INSTALL (HOST)
      - name: Install verified cargo-dist
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/cargo-dist"
          target="x86_64-unknown-linux-gnu"
          archive="cargo-dist-$target.tar.xz"
          expected_hash="cd355dab0b4c02fb59038fef87655550021d07f45f1d82f947a34ef98560abb8"
          mkdir -p "$tool_root"
          curl --proto '=https' --tlsv1.2 -LsSf \
            --output "$tool_root/$archive" \
            "https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/$archive"
          printf '%s  %s\n' "$expected_hash" "$tool_root/$archive" | sha256sum --check --strict
          tar -xJf "$tool_root/$archive" -C "$tool_root"
          echo "$tool_root/cargo-dist-$target" >> "$GITHUB_PATH"
      # END AWSWIT VERIFIED DIST INSTALL (HOST)
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      # BEGIN AWSWIT FINAL ASSET VALIDATION
      - name: Verify exact final release asset set
        run: python3 .github/scripts/validate-release-assets.py --phase final artifacts
      # END AWSWIT FINAL ASSET VALIDATION
      - name: Attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            artifacts/*.cdx.xml
            artifacts/*.json
            artifacts/*.ps1
            artifacts/*.sha256
            artifacts/*.sh
            artifacts/*.sum
            artifacts/*.tar.gz
            artifacts/*.tar.xz
            artifacts/*.zip
      # BEGIN AWSWIT TRANSACTIONAL RELEASE STEP
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
          RELEASE_TAG: "${{ needs.plan.outputs.tag }}"
        run: |
          set -euo pipefail
          bash .github/scripts/check-release-repository-policy.sh "$RELEASE_TAG"
          # Write and read notes from a file to avoid quoting breaking things
          printf '%s\n' "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"

          is_prerelease=false
          if [[ "$PRERELEASE_FLAG" == "--prerelease" ]]; then
            is_prerelease=true
          elif [[ -n "$PRERELEASE_FLAG" ]]; then
            echo "Unexpected prerelease flag" >&2
            exit 1
          fi

          tag_ref="refs/tags/$RELEASE_TAG"
          owned_tag=false
          owned_release_id=""

          remote_tag_sha() {
            local refs
            refs=$(git ls-remote --exit-code --refs origin "$tag_ref") || return 1
            test "$(printf '%s\n' "$refs" | wc -l)" -eq 1 || return 1
            printf '%s\n' "$refs" | awk '{ print $1 }'
          }

          cleanup_release() {
            result=${1:?cleanup status is required}
            if [[ "$result" -eq 0 ]]; then
              result=1
            fi
            trap - ERR INT TERM
            release_removed=false
            if [[ -n "$owned_release_id" ]]; then
              release_state=$(gh api \
                "repos/$GITHUB_REPOSITORY/releases/$owned_release_id" 2>/dev/null || true)
              if jq -e \
                --argjson id "$owned_release_id" \
                --arg tag "$RELEASE_TAG" \
                '.id == $id and .tag_name == $tag and .draft == true' \
                <<<"$release_state" >/dev/null; then
                if ! gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/$owned_release_id"; then
                  echo "Could not clean up owned draft release $RELEASE_TAG" >&2
                else
                  release_removed=true
                fi
              else
                echo "Refusing to delete a release that is no longer the owned draft" >&2
              fi
            fi

            # If release creation failed before returning an owned ID, leave the
            # tag in place: a concurrent release may already refer to it.
            if [[ "$owned_tag" == true && "$release_removed" == true ]]; then
              current_tag_sha=$(remote_tag_sha 2>/dev/null || true)
              if [[ "$current_tag_sha" == "$RELEASE_COMMIT" ]]; then
                # The required no-bypass deletion rule normally rejects this
                # best-effort cleanup. In that case the correct-SHA tag remains
                # for explicit owner recovery; never weaken protection here.
                if ! gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"; then
                  echo "Could not clean up owned tag $RELEASE_TAG" >&2
                fi
              elif [[ -n "$current_tag_sha" ]]; then
                echo "Refusing to delete changed tag $RELEASE_TAG" >&2
              fi
            fi
            exit "$result"
          }
          trap 'cleanup_release "$?"' ERR
          trap 'cleanup_release 130' INT
          trap 'cleanup_release 143' TERM

          # Creating the ref is the atomic ownership boundary. A pre-existing or
          # concurrently-created tag makes the API fail without granting cleanup rights.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="$tag_ref" \
            -f sha="$RELEASE_COMMIT" >/dev/null
          owned_tag=true
          test "$(remote_tag_sha)" = "$RELEASE_COMMIT"

          release_payload=$(jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg title "$ANNOUNCEMENT_TITLE" \
            --rawfile body "$RUNNER_TEMP/notes.txt" \
            --argjson prerelease "$is_prerelease" \
            '{tag_name: $tag, name: $title, body: $body, draft: true, prerelease: $prerelease}')
          release_response=$(gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases" --input - <<<"$release_payload")
          owned_release_id=$(jq -er '.id | select(type == "number")' <<<"$release_response")
          gh release upload "$RELEASE_TAG" artifacts/*

          local_assets=$(find artifacts -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          remote_assets=$(gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[].name' | LC_ALL=C sort)
          test "$remote_assets" = "$local_assets"
          test "$(remote_tag_sha)" = "$RELEASE_COMMIT"

          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$owned_release_id" \
            -F draft=false >/dev/null
          owned_release_id=""
          owned_tag=false
          trap - ERR INT TERM
      # END AWSWIT TRANSACTIONAL RELEASE STEP

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive

#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
# BEGIN AWSWIT LEAST-PRIVILEGE DEFAULT
permissions:
  "contents": "read"
# END AWSWIT LEAST-PRIVILEGE DEFAULT

# BEGIN AWSWIT RELEASE CONCURRENCY
concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false
# END AWSWIT RELEASE CONCURRENCY

# This task will run whenever you workflow_dispatch with a tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release Tag
        required: true
        default: dry-run
        type: string

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ (inputs.tag != 'dry-run' && inputs.tag) || '' }}
      tag-flag: ${{ inputs.tag && inputs.tag != 'dry-run' && format('--tag={0}', inputs.tag) || '' }}
      publishing: ${{ inputs.tag && inputs.tag != 'dry-run' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # BEGIN AWSWIT RELEASE INPUT GUARD
      - name: Validate release request
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == "dry-run" ]]; then
            exit 0
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from main" >&2
            exit 1
          fi
          semver='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$RELEASE_TAG" =~ $semver ]]; then
            echo "Release tag must be v-prefixed SemVer" >&2
            exit 1
          fi
      # END AWSWIT RELEASE INPUT GUARD
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      # BEGIN AWSWIT RELEASE REPOSITORY POLICY (PLAN)
      - name: Verify immutable releases and protected release tags
        if: ${{ inputs.tag != 'dry-run' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash .github/scripts/check-release-repository-policy.sh "$RELEASE_TAG"
      # END AWSWIT RELEASE REPOSITORY POLICY (PLAN)
      # BEGIN AWSWIT VERIFIED DIST INSTALL (PLAN)
      - name: Install verified cargo-dist
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/cargo-dist"
          target="x86_64-unknown-linux-gnu"
          archive="cargo-dist-$target.tar.xz"
          expected_hash="cd355dab0b4c02fb59038fef87655550021d07f45f1d82f947a34ef98560abb8"
          mkdir -p "$tool_root"
          curl --proto '=https' --tlsv1.2 -LsSf \
            --output "$tool_root/$archive" \
            "https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/$archive"
          printf '%s  %s\n' "$expected_hash" "$tool_root/$archive" | sha256sum --check --strict
          tar -xJf "$tool_root/$archive" -C "$tool_root"
          echo "$tool_root/cargo-dist-$target" >> "$GITHUB_PATH"
      # END AWSWIT VERIFIED DIST INSTALL (PLAN)
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (inputs.tag && inputs.tag != 'dry-run' && format('host --steps=create --tag={0}', inputs.tag)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') || inputs.tag == 'dry-run' }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            # BEGIN AWSWIT GENERATED SHELL LINT (RUSTUP PATH)
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            # END AWSWIT GENERATED SHELL LINT (RUSTUP PATH)
          fi
      # BEGIN AWSWIT VERIFIED DIST INSTALL (BUILD)
      - name: Install verified cargo-dist
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          DIST_TARGET: ${{ join(matrix.targets, '') }}
        run: |
          set -euo pipefail
          case "$DIST_TARGET" in
            aarch64-apple-darwin)
              expected_hash="decb01c64c12501931c3cac3111b368a7f48adf8d9e65455c08e5757b9a1fd6f"
              ;;
            aarch64-unknown-linux-gnu)
              expected_hash="382cc29ff91ef12a5bf78ad8ee1804661d24e2fbe64b1bdedd6078723b677ae5"
              ;;
            x86_64-apple-darwin)
              expected_hash="fd4d8f9f07802359cbcdc52bac3abd7d5201c4b73a7cbcdd6faca2232a389f0c"
              ;;
            x86_64-unknown-linux-gnu)
              expected_hash="cd355dab0b4c02fb59038fef87655550021d07f45f1d82f947a34ef98560abb8"
              ;;
            *)
              echo "No pinned cargo-dist archive for $DIST_TARGET" >&2
              exit 1
              ;;
          esac
          tool_root="$RUNNER_TEMP/cargo-dist"
          archive="cargo-dist-$DIST_TARGET.tar.xz"
          mkdir -p "$tool_root"
          curl --proto '=https' --tlsv1.2 -LsSf \
            --output "$tool_root/$archive" \
            "https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/$archive"
          printf '%s  %s\n' "$expected_hash" "$tool_root/$archive" | shasum -a 256 --check
          tar -xJf "$tool_root/$archive" -C "$tool_root"
          echo "$tool_root/cargo-dist-$DIST_TARGET" >> "$GITHUB_PATH"
      - name: Install verified cargo-dist
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          DIST_TARGET: ${{ join(matrix.targets, '') }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DIST_TARGET -ne 'x86_64-pc-windows-msvc') {
            throw "No pinned cargo-dist archive for $env:DIST_TARGET"
          }
          $expectedHash = 'a14e17557b269b101405e0cc6b647581d56313c954a51c7fddd423bba21e17b2'
          $toolRoot = Join-Path $env:RUNNER_TEMP 'cargo-dist'
          $archive = "cargo-dist-$env:DIST_TARGET.zip"
          $archivePath = Join-Path $toolRoot $archive
          New-Item -ItemType Directory -Force -Path $toolRoot | Out-Null
          Invoke-WebRequest -Uri "https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/$archive" -OutFile $archivePath
          $actualHash = (Get-FileHash -Algorithm SHA256 -Path $archivePath).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "cargo-dist archive checksum mismatch: expected $expectedHash, got $actualHash"
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $toolRoot
          $toolRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # END AWSWIT VERIFIED DIST INSTALL (BUILD)
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      # BEGIN AWSWIT NATIVE ARTIFACT SMOKE
      - name: Smoke native packaged executable
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          DIST_TARGET: ${{ join(matrix.targets, '') }}
        run: |
          set -euo pipefail
          archive="target/distrib/awswit-$DIST_TARGET.tar.xz"
          smoke_root="$RUNNER_TEMP/awswit-native-smoke"
          test -s "$archive"
          mkdir -p "$smoke_root"
          tar -xJf "$archive" -C "$smoke_root"
          binary="$smoke_root/awswit-$DIST_TARGET/awswit"
          test -x "$binary"
          "$binary" --version | grep -Fq 'awswit '
          "$binary" --help >/dev/null
      - name: Smoke native packaged executable
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          DIST_TARGET: ${{ join(matrix.targets, '') }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "target/distrib/awswit-$env:DIST_TARGET.zip"
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'awswit-native-smoke'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw "missing archive $archive" }
          Expand-Archive -LiteralPath $archive -DestinationPath $smokeRoot
          $binary = Join-Path $smokeRoot "awswit-$env:DIST_TARGET/awswit.exe"
          & $binary --version | Select-String -SimpleMatch 'awswit ' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'version smoke failed' }
          & $binary --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'help smoke failed' }
      # END AWSWIT NATIVE ARTIFACT SMOKE
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          # BEGIN AWSWIT GENERATED SHELL LINT (LOCAL OUTPUT)
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # END AWSWIT GENERATED SHELL LINT (LOCAL OUTPUT)

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      # BEGIN AWSWIT VERIFIED DIST INSTALL (GLOBAL)
      - name: Install verified cargo-dist
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/cargo-dist"
          target="x86_64-unknown-linux-gnu"
          archive="cargo-dist-$target.tar.xz"
          expected_hash="cd355dab0b4c02fb59038fef87655550021d07f45f1d82f947a34ef98560abb8"
          mkdir -p "$tool_root"
          curl --proto '=https' --tlsv1.2 -LsSf \
            --output "$tool_root/$archive" \
            "https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/$archive"
          printf '%s  %s\n' "$expected_hash" "$tool_root/$archive" | sha256sum --check --strict
          tar -xJf "$tool_root/$archive" -C "$tool_root"
          echo "$tool_root/cargo-dist-$target" >> "$GITHUB_PATH"
      # END AWSWIT VERIFIED DIST INSTALL (GLOBAL)
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          # BEGIN AWSWIT GENERATED SHELL LINT (GLOBAL OUTPUT)
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # END AWSWIT GENERATED SHELL LINT (GLOBAL OUTPUT)

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  custom-release-gate:
    needs:
      - plan
      - build-local-artifacts
      # BEGIN AWSWIT RELEASE GATE GLOBAL DEPENDENCY
      - build-global-artifacts
      # END AWSWIT RELEASE GATE GLOBAL DEPENDENCY
    uses: ./.github/workflows/release-gate.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    # BEGIN AWSWIT NO INHERITED RELEASE SECRETS
    # The local artifact gate has no secret contract. Do not expose repository
    # or organization secrets to a workflow selected from the dispatched ref.
    # END AWSWIT NO INHERITED RELEASE SECRETS

name: Release PR

permissions:
  actions: write
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main

jobs:
  # Create / update the release PR with version bumps and changelog.
  # Once that PR is merged, dispatch release.yml with the version tag. The
  # release workflow creates the tag only after every artifact gate succeeds.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.repository_owner == 'atriumnook' }}
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch CI for the release PR
        if: ${{ steps.release-plz.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release-plz.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          head_branch=$(jq -er '.head_branch' <<< "$RELEASE_PR")
          base_branch=$(jq -er '.base_branch' <<< "$RELEASE_PR")
          test "$base_branch" = "main"
          [[ "$head_branch" == release-plz-* ]]
          gh workflow run ci.yml --ref "$head_branch"
